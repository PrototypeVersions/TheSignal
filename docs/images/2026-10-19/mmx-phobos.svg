<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="g" cx="40%" cy="45%" r="75%"><stop offset="0" stop-color="#16243D"/><stop offset="1" stop-color="#0B1422"/></radialGradient>
    <radialGradient id="mars" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#FF8B7B"/><stop offset="1" stop-color="#B4524A"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#g)"/>
  <!-- a few stars -->
  <g fill="#86A2FF" opacity="0.5">
    <circle cx="90" cy="110" r="3"/><circle cx="260" cy="640" r="2.5"/><circle cx="430" cy="90" r="2"/>
    <circle cx="610" cy="720" r="3"/><circle cx="700" cy="60" r="2"/><circle cx="140" cy="420" r="2"/>
    <circle cx="520" cy="300" r="2"/><circle cx="1150" cy="60" r="2.5"/>
  </g>
  <!-- Mars, large, at the right edge -->
  <circle cx="1080" cy="520" r="300" fill="url(#mars)"/>
  <path d="M860 420 C 940 450, 1020 430, 1100 470 C 1170 500, 1260 480, 1300 500" fill="none" stroke="#9A443D" stroke-width="18" opacity="0.6"/>
  <path d="M900 600 C 980 620, 1080 590, 1180 640" fill="none" stroke="#9A443D" stroke-width="12" opacity="0.5"/>
  <!-- Phobos: small lumpy moon with craters -->
  <g transform="translate(700 330) rotate(-18)">
    <path d="M-110 -10 C -112 -62, -60 -84, -10 -78 C 40 -90, 104 -66, 112 -14 C 122 40, 80 76, 20 72 C -30 86, -96 66, -110 -10 Z" fill="#23365A" stroke="#4E66B8" stroke-width="4"/>
    <circle cx="-40" cy="-20" r="26" fill="#1A2943" stroke="#2F4163" stroke-width="4"/>
    <circle cx="40" cy="20" r="14" fill="#1A2943" stroke="#2F4163" stroke-width="3"/>
    <circle cx="62" cy="-34" r="9" fill="#1A2943"/>
  </g>
  <!-- outbound dotted path from the left to Phobos -->
  <path d="M60 690 C 220 640, 330 520, 470 450 C 540 415, 580 405, 600 400" fill="none" stroke="#86A2FF" stroke-width="7" stroke-dasharray="2 22" stroke-linecap="round"/>
  <!-- the spacecraft approaching -->
  <g transform="translate(470 452) rotate(-24)">
    <rect x="-130" y="-16" width="90" height="32" rx="3" fill="#86A2FF" opacity="0.85"/>
    <path d="M-115 -16 V16 M-100 -16 V16 M-85 -16 V16 M-70 -16 V16 M-55 -16 V16" stroke="#16243D" stroke-width="3"/>
    <rect x="40" y="-16" width="90" height="32" rx="3" fill="#86A2FF" opacity="0.85"/>
    <path d="M55 -16 V16 M70 -16 V16 M85 -16 V16 M100 -16 V16 M115 -16 V16" stroke="#16243D" stroke-width="3"/>
    <rect x="-40" y="-36" width="80" height="72" rx="8" fill="#E9B44C"/>
    <rect x="-40" y="-6" width="80" height="12" fill="#C8952F"/>
    <!-- sampler arm reaching forward -->
    <path d="M40 30 L70 70 L92 70" fill="none" stroke="#E9B44C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- the small return capsule heading home, faint return arc -->
  <path d="M640 470 C 520 600, 360 700, 190 760" fill="none" stroke="#E9B44C" stroke-width="4" stroke-dasharray="2 18" stroke-linecap="round" opacity="0.55"/>
  <circle cx="190" cy="760" r="12" fill="#E9B44C" opacity="0.7"/>
</svg>
